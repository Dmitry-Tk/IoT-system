<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>ESP32-C6 Монитор АЦП</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; display: flex; justify-content: center; padding: 16px; margin: 0; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 20px; max-width: 480px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.4); box-sizing: border-box; }
        h2 { margin-top: 0; font-size: 1.25rem; color: #ffffff; border-bottom: 1px solid #333; padding-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .status { font-size: 0.85rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #cf6679; flex-shrink: 0; }
        .dot.connected { background: #03dac6; }
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .metric { background: #2c2c2c; padding: 12px; border-radius: 8px; text-align: center; }
        .metric-label { font-size: 0.75rem; color: #aaa; margin-bottom: 4px; }
        .metric-val { font-size: 1.5rem; font-weight: bold; color: #bb86fc; }
        .chart-box { background: #161616; border: 1px solid #333; border-radius: 8px; padding: 8px; margin-bottom: 16px; }
        canvas { width: 100%; height: 180px; display: block; }
        .controls { display: flex; gap: 12px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s, transform 0.1s; }
        button:active { opacity: 0.8; transform: scale(0.98); }
        .btn-on { background: #03dac6; color: #000; }
        .btn-off { background: #373737; color: #fff; }
        .log { margin-top: 14px; font-size: 0.8rem; color: #888; min-height: 1.2em; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>
            <span>ESP32-C6 Телеметрия</span>
            <span style="font-size: 0.8rem; color: #03dac6; font-weight: normal;">1.0 Гц</span>
        </h2>
        <div class="status">
            <div id="statusDot" class="dot"></div>
            <span id="statusText">Отключено</span>
        </div>

        <div class="data-grid">
            <div class="metric">
                <div class="metric-label">АЦП (RAW 12-bit)</div>
                <div id="adcRaw" class="metric-val">---</div>
            </div>
            <div class="metric">
                <div class="metric-label">Напряжение (В)</div>
                <div id="adcMv" class="metric-val">---</div>
            </div>
        </div>

        <div class="chart-box">
            <canvas id="adcChart"></canvas>
        </div>

        <div class="controls">
            <button class="btn-on" onclick="sendCmd('CMD:LED_ON')">GPIO ВКЛ</button>
            <button class="btn-off" onclick="sendCmd('CMD:LED_OFF')">GPIO ВЫКЛ</button>
        </div>
        <div id="logMsg" class="log">Ожидание подключения...</div>
    </div>

    <script>
        let ws;
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const adcRawEl = document.getElementById('adcRaw');
        const adcMvEl = document.getElementById('adcMv');
        const logEl = document.getElementById('logMsg');
        const canvas = document.getElementById('adcChart');
        const ctx = canvas.getContext('2d');

        // Буфер истории графика (60 точек = 30 секунд при 2 Гц)
        const MAX_POINTS = 60;
        const MAX_MV = 3300;
        const history = [];

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            drawChart();
        }
        window.addEventListener('resize', resizeCanvas);

        function drawChart() {
            const w = canvas.getBoundingClientRect().width;
            const h = canvas.getBoundingClientRect().height;
            const padLeft = 38;
            const padRight = 10;
            const padTop = 12;
            const padBottom = 12;
            const plotW = w - padLeft - padRight;
            const plotH = h - padTop - padBottom;

            ctx.clearRect(0, 0, w, h);

            // Горизонтальная сетка и подписи шкалы (0, 1100, 2200, 3300 мВ)
            ctx.strokeStyle = '#2a2a2a';
            ctx.fillStyle = '#777';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.lineWidth = 1;

            const steps = 3;
            for (let i = 0; i <= steps; i++) {
                const val = Math.round((MAX_MV / steps) * i);
                const y = padTop + plotH - (plotH * (i / steps));

                ctx.beginPath();
                ctx.moveTo(padLeft, y);
                ctx.lineTo(w - padRight, y);
                ctx.stroke();

                ctx.fillText(val, padLeft - 6, y);
            }

            if (history.length < 2) return;

            // Линия графика
            ctx.beginPath();
            ctx.strokeStyle = '#03dac6';
            ctx.lineWidth = 2;
            ctx.lineJoin = 'round';

            const stepX = plotW / (MAX_POINTS - 1);
            const startOffset = MAX_POINTS - history.length;

            history.forEach((val, idx) => {
                const clamped = Math.max(0, Math.min(MAX_MV, val));
                const x = padLeft + (startOffset + idx) * stepX;
                const y = padTop + plotH - (clamped / MAX_MV) * plotH;
                if (idx === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();

            // Заливка под графиком
            const lastX = padLeft + (startOffset + history.length - 1) * stepX;
            const firstX = padLeft + startOffset * stepX;
            ctx.lineTo(lastX, padTop + plotH);
            ctx.lineTo(firstX, padTop + plotH);
            ctx.closePath();
            ctx.fillStyle = 'rgba(3, 218, 198, 0.12)';
            ctx.fill();
        }

        function connectWS() {
            ws = new WebSocket(`ws://${window.location.host}/ws`);

            ws.onopen = () => {
                statusDot.classList.add('connected');
                statusText.textContent = 'Подключено (192.168.4.1)';
                logEl.textContent = 'Связь установлена';
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.adc_raw !== undefined) {
                        adcRawEl.textContent = data.adc_raw;
                        const mv = data.adc_mv >= 0 ? data.adc_mv : Math.round((data.adc_raw / 4095) * MAX_MV);
                        adcMvEl.textContent = mv;

                        history.push(mv);
                        if (history.length > MAX_POINTS) history.shift();
                        drawChart();
                    }
                    if (data.ack) {
                        logEl.textContent = `ESP32: ${data.ack}`;
                    }
                } catch (e) {
                    console.error('Ошибка JSON:', e);
                }
            };

            ws.onclose = () => {
                statusDot.classList.remove('connected');
                statusText.textContent = 'Переподключение...';
                setTimeout(connectWS, 1500);
            };
        }

        function sendCmd(cmd) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(cmd);
            }
        }

        resizeCanvas();
        connectWS();
    </script>
</body>
</html>
